name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Run core tests
        run: >-
          python -m pytest -m "not benchmark and not gpu" --maxfail=1
          --junitxml=core-tests.xml
      - name: Enforce per-module coverage floors for failure-prone modules
        run: >-
          python -m coverage report
          --include="*/project_backup.py,*/runtime/probe.py,*/runtime/tools.py"
          --fail-under=85
      - name: Annotate core test failure
        if: failure()
        run: python .github/scripts/report_pytest_failure.py core-tests.xml

      - name: Set up Java for official EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and verify official EPUBCheck 5.4.0
        run: |
          curl --fail --show-error --location --retry 3 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            -o epubcheck-5.4.0.zip
          echo '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  epubcheck-5.4.0.zip' | sha256sum --check
          unzip -q epubcheck-5.4.0.zip

      - name: Run official EPUBCheck positive and negative controls
        run: python .github/scripts/epubcheck_gate.py epubcheck-5.4.0/epubcheck.jar

  python-314:
    name: Python 3.14.4 core compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: scribeforge --help
      - name: Run Python 3.14 compatibility tests
        run: >-
          python -m pytest -m "not benchmark and not gpu" --no-cov --maxfail=1
          --junitxml=python-314-tests.xml
      - name: Annotate Python 3.14 test failure
        if: failure()
        run: python .github/scripts/report_pytest_failure.py python-314-tests.xml
