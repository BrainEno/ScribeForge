name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -m "not benchmark and not gpu"

      # EPUBCheck official conformance validation (issue #84). Skipped when no
      # Java runtime is available; the internal check_epub() already runs on
      # every build and covers most EPUBCheck checkpoints.
      - name: Check Java availability
        id: java-check
        run: |
          if command -v java >/dev/null 2>&1; then echo "java_available=true" >> "$GITHUB_OUTPUT"; else echo "java_available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run EPUBCheck conformance validation
        if: steps.java-check.outputs.java_available == 'true'
        continue-on-error: true
        run: |
          EPUBCHECK_VERSION=5.3.2
          if ! command -v unzip >/dev/null 2>&1; then
            echo "unzip not available; skipping EPUBCheck download."
            exit 0
          fi
          if ! curl -sL --fail "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip" -o epubcheck.zip; then
            echo "EPUBCheck download failed; skipping official conformance validation."
            exit 0
          fi
          unzip -q epubcheck.zip
          EPUB_FILE=$(find . -name '*.epub' | head -1)
          if [ -n "$EPUB_FILE" ]; then
            java -jar "epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "$EPUB_FILE" || true
          else
            echo "No EPUB file found to validate; EPUBCheck jar is available for manual use."
          fi

  python-314:
    name: Python 3.14.4 core compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: scribeforge --help
      - name: Run Python 3.14 compatibility tests
        run: >-
          python -m pytest -m "not benchmark and not gpu" --no-cov --maxfail=1
          --junitxml=python-314-tests.xml
      - name: Annotate Python 3.14 test failure
        if: failure()
        run: python .github/scripts/report_pytest_failure.py python-314-tests.xml
