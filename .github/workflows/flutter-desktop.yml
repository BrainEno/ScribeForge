name: Flutter Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        shell: bash
        run: |
          echo "::notice title=STEP::format start"
          dart format --output=none --set-exit-if-changed . 2>&1 | while IFS= read -r line; do
            echo "::error title=FMT LINE STEP::${line//%/%25}"
          done || true
          echo "::notice title=STEP::format probed"
          dart format . || true
          git diff -- . > /tmp/fmt.diff || true
          split -b 2500 /tmp/fmt.diff /tmp/fmtpart. || true
          for part in /tmp/fmtpart.*; do
            [ -e "$part" ] || continue
            msg=$(cat "$part" | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/ %0A /g')
            echo "::error title=DART FORMAT DIFF::${msg:0:3500}"
          done
          rm -f /tmp/fmtpart.*
          dart format --set-exit-if-changed .
      - name: Analyze Flutter client
        id: analyze
        shell: bash
        run: |
          echo "::notice title=STEP::analyze start"
          set -o pipefail
          flutter analyze --machine 2>&1 | tee analyze_output.txt
          echo "::notice title=STEP::analyze done"
      - name: Surface analyzer diagnostics
        if: failure() && steps.analyze.outcome == 'failure'
        shell: bash
        run: |
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              printf '::notice title=Flutter analyzer output::%s\n' "$line"
            fi
          done < analyze_output.txt
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: clients/flutter_desktop/analyze_output.txt
      - name: Run replaceable desktop workflow tests
        shell: bash
        run: |
          echo "::notice title=STEP::workflow test start"
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 90s flutter test --reporter expanded --no-color --timeout 3m test/desktop_workflow_test.dart 2>&1 | tee flutter_test_output.txt
          echo "::notice title=STEP::workflow test done"
      - name: Run Flutter tests
        shell: bash
        run: |
          echo "::notice title=STEP::full test start"
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 8m flutter test --reporter expanded --no-color --timeout 3m 2>&1 | tee -a flutter_test_output.txt
          echo "::notice title=STEP::full test done"
      - name: Show Flutter test failures as annotations
        if: failure()
        run: |
          if [ -f flutter_test_output.txt ]; then
            python -c 'from pathlib import Path; lines = Path("flutter_test_output.txt").read_text(errors="replace").splitlines(); markers = ("══╡", "Expected:", "Actual:", "Which:", "The following", "Failed assertion:", "NoSuchMethodError", "Timed out", "Some tests failed"); tail = [line.strip()[:500] for line in lines[-60:] if line.strip()]; contexts = [line.strip()[:500] for index, line in enumerate(lines) if ("EXCEPTION CAUGHT" in line or "[E]" in line) for line in lines[index:min(index + 16, len(lines))] if line.strip()]; diagnostics = [line.strip()[:500] for line in lines if "[E]" in line or any(marker in line for marker in markers)]; selected = list(dict.fromkeys(contexts + diagnostics + tail[-12:]))[:40]; message = "%0A".join(line.replace("%", "%25") for line in selected); print(f"::error title=Flutter test failures::{message}")'
          fi

  flutter-desktop-windows:
    # Issue #220: the same analyze/format/test gates must pass on a real
    # Windows runner; the ubuntu job alone cannot prove desktop deliverability.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: |
          echo "::notice title=WIN STEP::pub get start"
          flutter pub get
          echo "::notice title=WIN STEP::pub get done"
      - name: Format Dart source
        shell: bash
        run: |
          echo "::notice title=WIN STEP::format start"
          dart format --output=none --set-exit-if-changed . 2>&1 | while IFS= read -r line; do
            echo "::error title=FMT LINE WIN STEP::${line//%/%25}"
          done || true
          echo "::notice title=WIN STEP::format probed"
          dart format . || true
          git diff -- . > /tmp/fmt.diff || true
          split -b 2500 /tmp/fmt.diff /tmp/fmtpart. || true
          for part in /tmp/fmtpart.*; do
            [ -e "$part" ] || continue
            msg=$(cat "$part" | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/ %0A /g')
            echo "::error title=DART FORMAT DIFF WIN::${msg:0:3500}"
          done
          rm -f /tmp/fmtpart.*
          dart format --set-exit-if-changed .
      - name: Analyze Flutter client
        shell: bash
        run: |
          echo "::notice title=WIN STEP::analyze start"
          flutter analyze --machine 2>&1 | tee analyze_win.txt
          python3 -c 'from pathlib import Path; d = Path("analyze_win.txt").read_text(errors="replace"); print("::error title=WIN ANALYZE::" + d.replace("%", "%25").replace("\n", "%0A")[:6000])'
      - name: Run Flutter tests on Windows
        shell: bash
        run: |
          echo "::notice title=WIN STEP::test start"
          flutter test --reporter expanded --no-color --timeout 3m > win_full.txt 2>&1 || true
          grep -n -A 12 '\[E\]' win_full.txt | head -120 | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/ %0A /g' | cut -c1-3500 | while IFS= read -r line; do
            echo "::error title=WIN TEST ERR::${line:0:3400}"
          done
          tail -5 win_full.txt | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/ %0A /g' | while IFS= read -r line; do
            echo "::error title=WIN TEST TAIL::${line:0:3400}"
          done
          flutter test --timeout 3m
