name: Flutter Desktop

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib test
      - name: Analyze Flutter client
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
