name: Flutter Desktop

on:
  pull_request:
  workflow_dispatch:

# Push and pull_request both fire for a PR branch. Share one slot so duplicate
# Flutter SDK downloads do not contend and older commits stop consuming runners.
concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Generate native desktop runners
        run: flutter create --platforms=windows,macos,linux --project-name scribeforge_desktop .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib test
      - name: Analyze Flutter client
        id: analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --machine 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.txt"
      - name: Surface analyzer diagnostics
        if: failure() && steps.analyze.outcome == 'failure'
        shell: bash
        run: |
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              printf '::notice title=Flutter analyzer output::%s\n' "$line"
            fi
          done < "$RUNNER_TEMP/flutter-analyze.txt"
      - name: Run Flutter tests
        run: flutter test
