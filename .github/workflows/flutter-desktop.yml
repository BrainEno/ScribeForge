name: Flutter Desktop

on:
  pull_request:
  workflow_dispatch:

# Push and pull_request both fire for a PR branch. Share one slot so duplicate
# Flutter SDK downloads do not contend and older commits stop consuming runners.
concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Generate native desktop runners
        run: flutter create --platforms=windows,macos,linux --project-name scribeforge_desktop .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib test
      - name: Analyze Flutter client
        run: flutter analyze
      - name: Surface analyzer diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          flutter analyze --machine > "$RUNNER_TEMP/flutter-analyze.txt" 2>&1
          cat "$RUNNER_TEMP/flutter-analyze.txt"
          while IFS='|' read -r severity type code path line column length message; do
            case "$severity" in
              ERROR|WARNING)
                level=warning
                if [ "$severity" = ERROR ]; then level=error; fi
                printf '::%s file=%s,line=%s,col=%s,title=%s::%s\n' \\
                  "$level" "$path" "$line" "$column" "$code" "$message"
                ;;
            esac
          done < "$RUNNER_TEMP/flutter-analyze.txt"
          exit 0
      - name: Run Flutter tests
        run: flutter test
