name: Flutter Desktop

on:
  pull_request:
  workflow_dispatch:

# Push and pull_request both fire for a PR branch. Share one slot so duplicate
# Flutter SDK downloads do not contend and older commits stop consuming runners.
concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Generate native desktop runners
        run: flutter create --platforms=windows,macos,linux --project-name scribeforge_desktop .
      # flutter create 会生成默认的 test/widget_test.dart，引用不存在的 MyApp，
        # 与项目的 UnifiedWorkspace 不兼容，需删除后使用项目自己的测试。
      - name: Remove default generated test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib test
      - name: Analyze Flutter client
        run: flutter analyze 2>&1 | tee analyze_output.txt; exit ${PIPESTATUS[0]}
      - name: Convert analyze output to GitHub annotations
        if: always()
        run: |
          if [ -f analyze_output.txt ]; then
            grep -E '^(error|warning|info) •' analyze_output.txt | while IFS= read -r line; do
              # Parse: "error • message • file:line:col • code"
              type=$(echo "$line" | sed 's/^\([a-z]*\) •.*/\1/')
              message=$(echo "$line" | sed 's/^[a-z]* • \(.*\) • .*/\1/')
              location=$(echo "$line" | sed 's/.* • \(.*:.*:.*\) •.*/\1/')
              file=$(echo "$location" | cut -d: -f1)
              line_num=$(echo "$location" | cut -d: -f2)
              col=$(echo "$location" | cut -d: -f3)
              if [ "$type" = "error" ]; then
                echo "::error file=$file,line=$line_num,col=$col::$message"
              elif [ "$type" = "warning" ]; then
                echo "::warning file=$file,line=$line_num,col=$col::$message"
              else
                echo "::notice file=$file,line=$line_num,col=$col::$message"
              fi
            done
          fi
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: clients/flutter_desktop/analyze_output.txt
      - name: Post analyze errors to PR comment
        if: failure()
        run: |
          if [ -f analyze_output.txt ]; then
            ERRORS=$(cat analyze_output.txt)
            PAYLOAD=$(printf '{"body":"## Flutter Analyze Errors\n\n\`\`\n%s\n\`\`\n"}' "$ERRORS")
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input - <<< "$PAYLOAD" 2>/dev/null || true
          fi
      - name: Run Flutter tests
        run: flutter test
