name: Flutter Desktop

on:
  pull_request:
  workflow_dispatch:

# Push and pull_request both fire for a PR branch. Share one slot so duplicate
# Flutter SDK downloads do not contend and older commits stop consuming runners.
concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Generate native desktop runners
        run: flutter create --platforms=windows,macos,linux --project-name scribeforge_desktop .
      # flutter create 会生成默认的 test/widget_test.dart，引用不存在的 MyApp，
        # 与项目的 UnifiedWorkspace 不兼容，需删除后使用项目自己的测试。
      - name: Remove default generated test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib test
      - name: Analyze Flutter client
        run: flutter analyze 2>&1 | tee analyze_output.txt; exit ${PIPESTATUS[0]}
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: clients/flutter_desktop/analyze_output.txt
      - name: Run Flutter tests
        run: flutter test
