name: Flutter Desktop

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Temporary dispatch-only runner for validating the new real-model workflow
  # before that workflow exists on the default branch. Removed after validation.
  paddle-real-smoke-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCRIBEFORGE_RUNTIME_ROOT: /tmp/scribeforge-paddle-real-runtime-${{ github.run_id }}
      SCRIBEFORGE_PADDLE_SMOKE_EVIDENCE: /tmp/scribeforge-paddle-real-evidence-${{ github.run_id }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: bash scripts/run_paddle_real_smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-real-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SCRIBEFORGE_PADDLE_SMOKE_EVIDENCE }}
          if-no-files-found: error

  flutter-desktop:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/flutter_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format --set-exit-if-changed .
      - name: Analyze Flutter client
        id: analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --machine 2>&1 | tee analyze_output.txt
      - name: Surface analyzer diagnostics
        if: failure() && steps.analyze.outcome == 'failure'
        shell: bash
        run: |
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              printf '::notice title=Flutter analyzer output::%s\n' "$line"
            fi
          done < analyze_output.txt
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: clients/flutter_desktop/analyze_output.txt
      - name: Run replaceable desktop workflow tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 90s flutter test --reporter expanded --no-color --timeout 3m test/desktop_workflow_test.dart 2>&1 | tee flutter_test_output.txt
      - name: Run Flutter tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 8m flutter test --reporter expanded --no-color --timeout 3m 2>&1 | tee -a flutter_test_output.txt
      - name: Show Flutter test failures as annotations
        if: failure()
        run: |
          if [ -f flutter_test_output.txt ]; then
            python -c 'from pathlib import Path; lines = Path("flutter_test_output.txt").read_text(errors="replace").splitlines(); markers = ("══╡", "Expected:", "Actual:", "Which:", "The following", "Failed assertion:", "NoSuchMethodError", "Timed out", "Some tests failed"); tail = [line.strip()[:500] for line in lines[-60:] if line.strip()]; contexts = [line.strip()[:500] for index, line in enumerate(lines) if "EXCEPTION CAUGHT" in line for line in lines[index:min(index + 24, len(lines))] if line.strip()]; diagnostics = [line.strip()[:500] for line in lines if "[E]" in line or any(marker in line for marker in markers)]; selected = list(dict.fromkeys(contexts + diagnostics + tail[-12:]))[:40]; message = "%0A".join(line.replace("%", "%25") for line in selected); print(f"::error title=Flutter test failures::{message}")'
          fi
