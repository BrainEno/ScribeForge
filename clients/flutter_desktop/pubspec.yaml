name: scribeforge_desktop
description: Flutter desktop workspace for evidence-aware PDF and EPUB candidate comparison.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.5.2
  crypto: ^3.0.7
  file_picker: ^13.1.0
  pdfrx: ^2.6.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
