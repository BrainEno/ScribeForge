include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: true
    # Const constructors/declarations are style preferences, not correctness
    # rules. Keeping them enabled blocks analyze on every non-const widget
    # construction in a growing UI codebase; they can be re-enabled once the
    # UI stabilizes.
    prefer_const_constructors: false
    prefer_const_declarations: false
